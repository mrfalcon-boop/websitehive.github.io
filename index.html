<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Website Builder SaaS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins;background:#0b0f19;color:white}
nav{display:flex;justify-content:space-between;padding:20px 8%;background:#05070d}
.hero{padding:120px 8%;text-align:center}
.btn{background:#4da3ff;padding:14px 30px;border-radius:10px;color:white;text-decoration:none}
.section{padding:80px 8%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px;margin-top:40px}
.card{background:#12182a;padding:30px;border-radius:16px}
input{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#4da3ff;color:white}
#dashboard{display:none}
</style>
</head>
<body>

<nav>
<h2>AI Builder SaaS</h2>
</nav>

<section class="hero">
<h1>Real Website Builder System</h1>
<p>Login • Create Site • Save Projects • Earn Money</p>
</section>

<section class="section" id="auth">
<h2>Signup</h2>
<input id="s_email" placeholder="Email">
<input id="s_pass" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>

<h2 style="margin-top:40px">Login</h2>
<input id="l_email" placeholder="Email">
<input id="l_pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</section>

<section class="section" id="dashboard">
<h2>Dashboard</h2>
<input id="site_name" placeholder="Website Name">
<button onclick="createSite()">Create Website</button>

<div id="sites" class="grid"></div>
<button onclick="logout()" style="margin-top:30px">Logout</button>
</section>

<script>
// 🔥 PUT YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "AIzaSyBjRU4bUKE3pwyTjHJPltugZ-Zmrax16rI",
  authDomain: "ai-builder-23c7e.firebaseapp.com",
  projectId: "ai-builder-23c7e",
  storageBucket: "ai-builder-23c7e.firebasestorage.app",
  messagingSenderId: "404759763912",
  appId: "1:404759763912:web:e52b9a42b991890a8efefd",
  measurementId: "G-F4SG95T4QQ"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

function signup(){
let e=s_email.value
let p=s_pass.value
auth.createUserWithEmailAndPassword(e,p).then(()=>alert("Account Created"))
}

function login(){
let e=l_email.value
let p=l_pass.value
auth.signInWithEmailAndPassword(e,p).then(()=>{
 auth.onAuthStateChanged(user=>{
  if(user){
   auth.style.display="none"
   dashboard.style.display="block"
   loadSites()
  }
 })
})}

function logout(){auth.signOut().then(()=>location.reload())}

function createSite(){
let name=site_name.value
let user=auth.currentUser
if(!user)return

db.collection("sites").add({
 uid:user.uid,
 name:name,
 date:new Date()
}).then(()=>loadSites())
}

function loadSites(){
let user=auth.currentUser
sites.innerHTML=""
db.collection("sites").where("uid","==",user.uid)
.get().then(snap=>{
 snap.forEach(doc=>{
  sites.innerHTML+=`<div class='card'>${doc.data().name}</div>`
 })
})}
</script>

</body>
</html>
