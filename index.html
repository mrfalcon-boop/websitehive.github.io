<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Builder</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{font-family:Arial;background:#0b0f19;color:white;text-align:center}
input,button,textarea{padding:12px;margin:8px;border-radius:8px;border:none}
button{background:#4da3ff;color:white;cursor:pointer}
.card{background:#12182a;padding:20px;margin:10px;border-radius:12px}
</style>
</head>
<body>

<h2>Signup</h2>
<input id="s_email" placeholder="Email">
<input id="s_pass" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>

<h2>Login</h2>
<input id="l_email" placeholder="Email">
<input id="l_pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<div id="dash" style="display:none">

<h2>AI Generator</h2>
<input id="idea" placeholder="Website Idea">
<textarea id="code" placeholder="Generated Code"></textarea>
<button onclick="generateAI()">Generate</button>

<h2>Payment</h2>
<div id="paypal-button-container"></div>

<h2>Your Sites</h2>
<div id="mysites"></div>

</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyBjRU4bUKE3pwyTjHJPltugZ-Zmrax16rI",
authDomain:"ai-builder-23c7e.firebaseapp.com",
projectId:"ai-builder-23c7e"
}

firebase.initializeApp(firebaseConfig)

let auth=firebase.auth()
let db=firebase.firestore()

function signup(){
auth.createUserWithEmailAndPassword(
s_email.value,
s_pass.value
).then(()=>alert("Signup Success"))
}

function login(){
auth.signInWithEmailAndPassword(
l_email.value,
l_pass.value
).then(()=>alert("Login Success"))
}

auth.onAuthStateChanged(function(user){
if(user){
dash.style.display="block"
loadSites()
}else{
dash.style.display="none"
}
})

async function generateAI(){
let user=auth.currentUser
let plan=await db.collection("plans").doc(user.uid).get()

if(!plan.exists){
alert("Buy Plan First")
return
}

let html=`<html><body><h1>${idea.value}</h1></body></html>`
code.value=html

await db.collection("sites").add({
uid:user.uid,
name:idea.value,
date:new Date()
})

loadSites()
}

function loadSites(){
let user=auth.currentUser
mysites.innerHTML=""
db.collection("sites").where("uid","==",user.uid).get().then(s=>{
s.forEach(d=>{
mysites.innerHTML+=`<div class="card">${d.data().name}</div>`
})
})
}
</script>

<script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>

<script>
paypal.Buttons({
createOrder:function(data,actions){
return actions.order.create({
purchase_units:[{amount:{value:'9.99'}}]
})
},
onApprove:async function(data,actions){
const details=await actions.order.capture()

let user=auth.currentUser

await db.collection("plans").doc(user.uid).set({
pro:true,
paypal:details.id
})

alert("Payment Success")
}
}).render('#paypal-button-container')
</script>

</body>
</html>
